<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script>
    // SPA redirect: convert path to query string and send to index.html
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + '/?r=' +
      encodeURIComponent(l.pathname + l.search) +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
